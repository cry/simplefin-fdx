<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimpleFIN Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --sidebar-bg: oklch(12% 0.014 258);
      --sidebar-text: oklch(87% 0.01 258);
      --sidebar-muted: oklch(50% 0.012 258);
      --sidebar-hover: oklch(19% 0.017 258);
      --sidebar-active-bg: oklch(27% 0.022 258);
      --sidebar-active-text: oklch(97% 0.008 258);
      --sidebar-border: oklch(22% 0.016 258);
      --sidebar-label: oklch(40% 0.01 258);
      --bg: oklch(96.5% 0.007 255);
      --surface: oklch(99.5% 0.003 255);
      --border: oklch(88% 0.009 255);
      --text: oklch(19% 0.011 258);
      --muted: oklch(52% 0.011 258);
      --hover: oklch(93% 0.01 255);
      --primary: oklch(56% 0.19 252);
      --primary-hover: oklch(50% 0.19 252);
      --primary-text: oklch(99% 0.004 252);
      --danger: oklch(51% 0.19 22);
      --success: oklch(48% 0.155 145);
      --active-text: oklch(45% 0.18 252);
      --radius: 8px;
      --radius-sm: 5px;
      --radius-lg: 12px;
      --font: 'Hanken Grotesk', system-ui, -apple-system, sans-serif;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: var(--font);
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
    }

    #layout { display: flex; height: 100%; }

    /* ── Sidebar ── */
    #sidebar {
      width: 240px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--sidebar-bg);
      overflow-y: auto;
      scrollbar-color: oklch(25% 0.014 258) transparent;
      scrollbar-width: thin;
    }

    #sidebar-header {
      padding: 16px 14px 12px;
      border-bottom: 1px solid var(--sidebar-border);
    }

    #sidebar-header h1 { margin: 0 0 4px; font-size: 16px; font-weight: 700; color: var(--sidebar-text); }

    #status {
      font-size: 12px;
      color: var(--sidebar-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #status::before {
      content: '';
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: oklch(65% 0.15 145);
      flex-shrink: 0;
    }
    #status.error { color: var(--sidebar-muted); }
    #status.error::before { background: oklch(60% 0.19 22); }

    .sidebar-section {
      padding: 8px 6px;
    }

    .sidebar-section + .sidebar-section {
      border-top: 1px solid var(--sidebar-border);
    }

    .sidebar-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--sidebar-label);
      padding: 4px 10px 6px;
    }

    .sidebar-btn {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      padding: 8px 10px;
      border: none;
      background: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: left;
      color: var(--sidebar-text);
      font-size: 14px;
      font-family: var(--font);
      transition: background 150ms ease;
    }

    .sidebar-btn:hover { background: var(--sidebar-hover); }

    .sidebar-btn.active {
      background: var(--sidebar-active-bg);
      color: var(--sidebar-active-text);
      font-weight: 600;
    }

    .acct-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .acct-bal {
      font-size: 12px;
      white-space: nowrap;
      flex-shrink: 0;
      color: var(--sidebar-muted);
      font-variant-numeric: tabular-nums;
    }

    .sidebar-btn.active .acct-bal { color: var(--sidebar-active-text); opacity: 0.75; }

    #sidebar .placeholder { color: var(--sidebar-muted); }

    /* ── Main ── */
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    #main-header {
      padding: 20px 24px 0;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    #main-header h2 { margin: 0 0 4px; font-size: 18px; font-weight: 700; }

    .balance-row { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
    .balance-row strong { color: var(--text); }

    .tab-bar { display: flex; gap: 2px; margin-top: 4px; }

    .tab-bar button {
      padding: 8px 14px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
      font-family: var(--font);
      color: var(--muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 150ms ease;
    }

    .tab-bar button:hover { color: var(--text); }

    .tab-bar button.active {
      color: var(--text);
      border-bottom-color: var(--text);
      font-weight: 600;
    }

    /* ── Content ── */
    #content { flex: 1; overflow-y: auto; padding: 20px 24px; }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .filter-bar label {
      font-size: 13px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filter-bar input[type="date"] {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 5px 8px;
      font-size: 13px;
      font-family: var(--font);
      background: var(--surface);
      color: var(--text);
    }

    .filter-bar button, .btn {
      padding: 5px 14px;
      background: var(--primary);
      color: var(--primary-text);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 13px;
      font-family: var(--font);
      transition: background 150ms ease;
    }

    .filter-bar button:hover, .btn:hover { background: var(--primary-hover); opacity: 1; }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn-ghost {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--hover); }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }

    thead th {
      text-align: left;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    thead th:first-child { padding-left: 0; }
    thead th:last-child { padding-right: 0; }

    tbody tr { border-top: 1px solid var(--border); transition: background 150ms ease; }
    tbody tr:first-child { border-top: none; }
    tbody tr:hover { background: var(--hover); }

    tbody td {
      padding: 10px 12px;
      vertical-align: middle;
    }

    tbody td:first-child { padding-left: 0; }
    tbody td:last-child { padding-right: 0; }

    .text-right { text-align: right; }
    .text-nowrap { white-space: nowrap; }

    .debit { color: var(--danger); }
    .credit { color: var(--success); }

    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 999px;
      background: oklch(72% 0.16 75 / 15%);
      color: oklch(45% 0.14 68);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-left: 6px;
      vertical-align: middle;
    }

    .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .placeholder { text-align: center; color: var(--muted); padding: 60px 0; }
    .error-msg { color: var(--danger); padding: 16px 0; }

    .pagination {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
    }

    .tx-clickable { cursor: pointer; }
    .tx-clickable:hover { background: var(--hover); }

    .source-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 1px 5px;
      border-radius: 3px;
      background: var(--hover);
      color: var(--muted);
    }

    .source-label.sfin { background: oklch(56% 0.19 252 / 12%); color: oklch(45% 0.18 252); }
    .source-label.lf   { background: oklch(48% 0.155 145 / 12%); color: oklch(35% 0.13 145); }

    /* ── Transaction detail modal ── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: oklch(0% 0 0 / 35%);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal {
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: 0 20px 60px oklch(0% 0 0 / 18%);
      width: 680px;
      max-width: 95vw;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      position: relative;
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .modal-title { margin: 0; font-size: 16px; font-weight: 700; }
    .modal-subtitle { font-size: 13px; color: var(--muted); margin-top: 3px; }

    .modal-close {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: var(--muted);
      padding: 0 4px;
      line-height: 1;
      flex-shrink: 0;
      transition: color 150ms ease;
    }

    .modal-close:hover { color: var(--text); }

    .modal-sources {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 560px) {
      .modal-sources { grid-template-columns: 1fr; }
    }

    .modal-source-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      background: var(--bg);
    }

    .modal-source-card .source-label {
      margin-bottom: 10px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .detail-row:last-child { border-bottom: none; }

    .detail-key {
      color: var(--muted);
      white-space: nowrap;
      font-size: 12px;
      flex-shrink: 0;
    }

    .detail-val {
      text-align: right;
      word-break: break-word;
    }

    .modal-match-row {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 20px;
      font-size: 13px;
      color: var(--muted);
    }

    .modal-match-row strong { color: var(--text); }

    /* ── Reconciliation management ── */
    .recon-stat {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      margin-right: 16px;
    }

    .status-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .status-badge.matched   { background: oklch(48% 0.155 145); color: #fff; }
    .status-badge.sfin-only { background: oklch(56% 0.19 252); color: #fff; }
    .status-badge.lf-only   { background: oklch(52% 0.16 68); color: #fff; }
    .status-badge.user      { background: oklch(55% 0.18 295); color: #fff; }

    .recon-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
    }

    .recon-form label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .recon-form select, .recon-form input {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 8px;
      font-size: 13px;
      font-family: var(--font);
      background: var(--surface);
      color: var(--text);
      min-width: 160px;
    }

    .inline-link-form {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .inline-link-form select {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px 8px;
      font-size: 12px;
      font-family: var(--font);
      background: var(--surface);
      color: var(--text);
    }

    .btn-sm {
      padding: 4px 10px;
      font-size: 12px;
      font-family: var(--font);
      background: var(--primary);
      color: var(--primary-text);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 150ms ease;
    }

    .btn-sm:hover { background: var(--primary-hover); opacity: 1; }

    .btn-sm.danger {
      background: var(--danger);
    }

    .btn-sm.danger:hover { background: oklch(45% 0.19 22); }

    .btn-sm.ghost {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-sm.ghost:hover { background: var(--hover); opacity: 1; }

    .confidence { font-variant-numeric: tabular-nums; }

    tbody td.text-right { font-variant-numeric: tabular-nums; }

    /* ── Mobile ── */
    #mobile-topbar {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      z-index: 100;
      background: var(--sidebar-bg);
      border-bottom: 1px solid var(--sidebar-border);
      align-items: center;
      gap: 10px;
      padding: 0 14px;
    }

    #mobile-topbar .mobile-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--sidebar-text);
    }

    #menu-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--sidebar-text);
      font-size: 20px;
      line-height: 1;
      padding: 6px;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
      transition: background 150ms ease;
    }

    #menu-btn:hover { background: var(--sidebar-hover); }

    #sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      top: 52px;
      background: oklch(0% 0 0 / 40%);
      backdrop-filter: blur(1px);
      z-index: 150;
    }

    @media (max-width: 640px) {
      #mobile-topbar { display: flex; }
      #sidebar-overlay { display: block; }

      html, body { height: 100%; overflow: hidden; }
      #layout { height: calc(100% - 52px); margin-top: 52px; }

      #sidebar {
        position: fixed;
        top: 52px;
        left: 0;
        bottom: 0;
        z-index: 200;
        width: 280px;
        transform: translateX(-100%);
        transition: transform 220ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      #sidebar.open {
        transform: translateX(0);
        box-shadow: 4px 0 32px oklch(0% 0 0 / 30%);
      }

      #main { width: 100%; min-width: 0; }

      #main-header { padding: 14px 16px 0; }
      #main-header h2 { font-size: 16px; }

      #content { padding: 12px 16px; overflow-x: auto; }

      table { min-width: 480px; }

      .filter-bar { gap: 8px; }
      .filter-bar input[type="date"] { font-size: 12px; padding: 4px 6px; }

      .modal { padding: 16px; border-radius: var(--radius); }
      .modal-match-row { flex-wrap: wrap; gap: 8px; }

      .recon-form { flex-direction: column; }
      .recon-form select, .recon-form input { min-width: 0; width: 100%; }

      .inline-link-form { flex-wrap: wrap; }
      .inline-link-form select { flex: 1; min-width: 0; }

      .pagination { flex-wrap: wrap; justify-content: center; }

      .balance-row { font-size: 12px; }
    }
  </style>
</head>
<body x-data="app()" x-init="init()">

  <!-- Mobile top bar -->
  <div id="mobile-topbar">
    <button id="menu-btn" @click="sidebarOpen = !sidebarOpen" :aria-expanded="sidebarOpen" aria-label="Toggle menu">
      <span x-text="sidebarOpen ? '✕' : '☰'"></span>
    </button>
    <span class="mobile-title">SimpleFIN</span>
  </div>

  <div id="layout">

    <!-- Sidebar overlay (mobile) -->
    <div id="sidebar-overlay" x-show="sidebarOpen" @click="sidebarOpen = false" style="display:none"></div>

    <!-- Sidebar -->
    <div id="sidebar" :class="{ open: sidebarOpen }">
      <div id="sidebar-header">
        <h1>SimpleFIN</h1>
        <div id="status" :class="{ error: statusError }" x-text="status"></div>
      </div>

      <!-- Overview nav -->
      <div class="sidebar-section">
        <button class="sidebar-btn" :class="{ active: view === 'overview' }" @click="selectOverview()">
          Overview
        </button>
        <template x-if="lunchflowPresent">
          <button class="sidebar-btn" :class="{ active: view === 'reconciliation' }" @click="selectReconciliation()">
            Reconciliation
          </button>
        </template>
      </div>

      <!-- Account list -->
      <template x-if="accounts.length === 0 && !accountsError">
        <div class="sidebar-section">
          <div class="placeholder" style="padding:16px 10px;font-size:13px">Loading…</div>
        </div>
      </template>
      <template x-if="accountsError">
        <div class="sidebar-section">
          <div class="error-msg" style="padding:12px 10px" x-text="accountsError"></div>
        </div>
      </template>

      <template x-if="reconAccounts.length > 0">
        <div class="sidebar-section">
          <div class="sidebar-label">Reconciled</div>
          <template x-for="acct in reconAccounts" :key="acct.accountId">
            <button class="sidebar-btn" :class="{ active: view === 'account' && selected?.accountId === acct.accountId }" @click="selectAccount(acct)">
              <span class="acct-name" x-text="acct.displayName"></span>
              <span class="acct-bal" x-text="fmt(acct.currentBalance, acct.currency?.currencyCode)"></span>
            </button>
          </template>
        </div>
      </template>

      <template x-if="sfinAccounts.length > 0">
        <div class="sidebar-section">
          <div class="sidebar-label">SimpleFIN</div>
          <template x-for="acct in sfinAccounts" :key="acct.accountId">
            <button class="sidebar-btn" :class="{ active: view === 'account' && selected?.accountId === acct.accountId }" @click="selectAccount(acct)">
              <span class="acct-name" x-text="acct.displayName"></span>
              <span class="acct-bal" x-text="fmt(acct.currentBalance, acct.currency?.currencyCode)"></span>
            </button>
          </template>
        </div>
      </template>

      <template x-if="lfAccounts.length > 0">
        <div class="sidebar-section">
          <div class="sidebar-label">LunchFlow</div>
          <template x-for="acct in lfAccounts" :key="acct.accountId">
            <button class="sidebar-btn" :class="{ active: view === 'account' && selected?.accountId === acct.accountId }" @click="selectAccount(acct)">
              <span class="acct-name" x-text="acct.displayName"></span>
              <span class="acct-bal" x-text="fmt(acct.currentBalance, acct.currency?.currencyCode)"></span>
            </button>
          </template>
        </div>
      </template>
    </div>

    <!-- Main panel -->
    <div id="main">

      <!-- Overview -->
      <template x-if="view === 'overview'">
        <div style="display:flex;flex-direction:column;height:100%">
          <div id="main-header">
            <h2>Overview</h2>
            <div class="balance-row"><span x-text="overviewSubtitle"></span></div>
            <div class="tab-bar">
              <button @click="setOverviewFilter('all')" :class="{ active: overviewFilter === 'all' }">All accounts</button>
              <button @click="setOverviewFilter('reconciled')" :class="{ active: overviewFilter === 'reconciled' }">Reconciled only</button>
            </div>
          </div>
          <div id="content">
            <template x-if="overviewLoading">
              <div class="placeholder">Loading…</div>
            </template>
            <template x-if="overviewError">
              <div class="error-msg" x-text="overviewError"></div>
            </template>
            <template x-if="!overviewLoading && !overviewError && displayItems.length === 0">
              <div class="placeholder">No transactions found.</div>
            </template>
            <template x-if="!overviewLoading && !overviewError && displayItems.length > 0">
              <div>
                <table>
                  <thead>
                    <tr>
                      <th>Date</th>
                      <th>Account</th>
                      <th>Description</th>
                      <th class="text-right">Amount</th>
                    </tr>
                  </thead>
                  <template x-for="tx in overviewPagedItems" :key="tx.transactionId">
                    <tbody>
                      <tr class="tx-clickable" @click="openTxDetail(tx)">
                        <td class="text-nowrap">
                          <span x-text="fmtDateShort(txDate(tx))"></span>
                          <template x-if="tx.status === 'PENDING'">
                            <div style="font-size:11px;color:var(--muted)">authorized</div>
                          </template>
                        </td>
                        <td class="text-nowrap" style="color:var(--muted)" x-text="tx._accountName"></td>
                        <td>
                          <div>
                            <span x-text="tx.payee || tx.description"></span>
                            <template x-if="tx.status === 'PENDING'">
                              <span class="badge">pending</span>
                            </template>
                          </div>
                          <template x-if="tx.payee && tx.description !== tx.payee">
                            <div class="sub" x-text="tx.description"></div>
                          </template>
                        </td>
                        <td class="text-right text-nowrap"
                            :class="tx.debitCreditMemo === 'CREDIT' ? 'credit' : 'debit'"
                            x-text="(tx.debitCreditMemo === 'CREDIT' ? '+' : '') + fmt(tx.amount, tx._currency)">
                        </td>
                      </tr>
                    </tbody>
                  </template>
                </table>

                <!-- Pagination -->
                <template x-if="overviewTotalPages > 1">
                  <div class="pagination">
                    <button class="btn btn-ghost" :disabled="overviewPage === 0" @click="overviewPage--">← Prev</button>
                    <span>Page <span x-text="overviewPage + 1"></span> of <span x-text="overviewTotalPages"></span></span>
                    <button class="btn btn-ghost" :disabled="overviewPage >= overviewTotalPages - 1" @click="overviewPage++">Next →</button>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- Account detail -->
      <template x-if="view === 'account' && selected">
        <div style="display:flex;flex-direction:column;height:100%">
          <div id="main-header">
            <h2 x-text="selected.displayName"></h2>
            <div class="balance-row">
              Balance: <strong x-text="fmt(selected.currentBalance, selected.currency?.currencyCode)"></strong>
              <template x-if="selected.availableBalance != null">
                <span> &nbsp;·&nbsp; Available: <strong x-text="fmt(selected.availableBalance, selected.currency?.currencyCode)"></strong></span>
              </template>
              &nbsp;·&nbsp; as of <span x-text="fmtDate(selected.balanceDate)"></span>
            </div>
            <div class="tab-bar">
              <button @click="switchTab('transactions')" :class="{ active: tab === 'transactions' }">Transactions</button>
              <button @click="switchTab('holdings')" :class="{ active: tab === 'holdings' }">Holdings</button>
            </div>
          </div>

          <div id="content">

            <!-- Transactions tab -->
            <template x-if="tab === 'transactions'">
              <div>
                <div class="filter-bar">
                  <label>From <input type="date" x-model="startDate" /></label>
                  <label>To <input type="date" x-model="endDate" /></label>
                  <button @click="loadTransactions()">Apply</button>
                </div>

                <template x-if="txLoading">
                  <div class="placeholder">Loading…</div>
                </template>
                <template x-if="txError">
                  <div class="error-msg" x-text="txError"></div>
                </template>
                <template x-if="!txLoading && !txError && transactions.length === 0">
                  <div class="placeholder">No transactions in this date range.</div>
                </template>
                <template x-if="!txLoading && !txError && transactions.length > 0">
                  <table>
                    <thead>
                      <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th class="text-right">Amount</th>
                      </tr>
                    </thead>
                    <template x-for="tx in transactions" :key="tx.transactionId">
                      <tbody>
                        <tr class="tx-clickable" @click="openTxDetail(tx)">
                          <td class="text-nowrap">
                            <span x-text="fmtDateShort(txDate(tx))"></span>
                            <template x-if="tx.status === 'PENDING'">
                              <div style="font-size:11px;color:var(--muted)">authorized</div>
                            </template>
                          </td>
                          <td>
                            <div>
                              <span x-text="tx.payee || tx.description"></span>
                              <template x-if="tx.status === 'PENDING'">
                                <span class="badge">pending</span>
                              </template>
                            </div>
                            <template x-if="tx.payee && tx.description !== tx.payee">
                              <div class="sub" x-text="tx.description"></div>
                            </template>
                          </td>
                          <td class="text-right text-nowrap"
                              :class="tx.debitCreditMemo === 'CREDIT' ? 'credit' : 'debit'"
                              x-text="(tx.debitCreditMemo === 'CREDIT' ? '+' : '') + fmt(tx.amount, selected.currency?.currencyCode)">
                          </td>
                        </tr>
                      </tbody>
                    </template>
                  </table>
                </template>
              </div>
            </template>

            <!-- Holdings tab -->
            <template x-if="tab === 'holdings'">
              <div>
                <template x-if="holdingsLoading">
                  <div class="placeholder">Loading…</div>
                </template>
                <template x-if="holdingsError">
                  <div class="error-msg" x-text="holdingsError"></div>
                </template>
                <template x-if="!holdingsLoading && !holdingsError && holdings.length === 0">
                  <div class="placeholder">No holdings for this account.</div>
                </template>
                <template x-if="!holdingsLoading && !holdingsError && holdings.length > 0">
                  <table>
                    <thead>
                      <tr>
                        <th>Symbol</th>
                        <th>Description</th>
                        <th class="text-right">Shares</th>
                        <th class="text-right">Market Value</th>
                        <th class="text-right">Cost Basis</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="h in holdings" :key="h.holdingId">
                        <tr>
                          <td><strong x-text="h.symbol ?? '—'"></strong></td>
                          <td x-text="h.description ?? '—'"></td>
                          <td class="text-right text-nowrap" x-text="h.units != null ? h.units.toFixed(4) : '—'"></td>
                          <td class="text-right text-nowrap" x-text="h.marketValue != null ? fmt(h.marketValue, selected.currency?.currencyCode) : '—'"></td>
                          <td class="text-right text-nowrap" x-text="h.costBasis != null ? fmt(h.costBasis, selected.currency?.currencyCode) : '—'"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </template>
              </div>
            </template>

          </div>
        </div>
      </template>

      <!-- Reconciliation management -->
      <template x-if="view === 'reconciliation'">
        <div style="display:flex;flex-direction:column;height:100%">
          <div id="main-header">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:16px">
              <h2 style="margin:0">Account Reconciliation</h2>
              <button class="btn btn-ghost" style="flex-shrink:0" :disabled="reconRunning" @click="runReconciliation()">
                <span x-text="reconRunning ? 'Running…' : 'Run Now'"></span>
              </button>
            </div>
            <div class="balance-row" style="margin-top:4px">
              <template x-if="reconMatches.length > 0">
                <span>
                  <span class="recon-stat"><strong x-text="reconMatchedCount"></strong> matched</span>
                  <span class="recon-stat"><strong x-text="reconSfinOnlyCount"></strong> SimpleFIN-only</span>
                  <span class="recon-stat"><strong x-text="reconLfOnlyCount"></strong> LunchFlow-only</span>
                </span>
              </template>
              <template x-if="reconMatches.length === 0 && !reconLoading">
                <span>No reconciliation data yet — waiting for first fetch.</span>
              </template>
            </div>
            <div class="tab-bar">
              <button @click="reconTab = 'matches'" :class="{ active: reconTab === 'matches' }">Account Matches</button>
              <button @click="reconTab = 'rules'" :class="{ active: reconTab === 'rules' }">Rules</button>
            </div>
          </div>

          <div id="content">
            <template x-if="reconLoading">
              <div class="placeholder">Loading…</div>
            </template>
            <template x-if="reconError">
              <div class="error-msg" x-text="reconError"></div>
            </template>

            <!-- Account Matches tab -->
            <template x-if="!reconLoading && !reconError && reconTab === 'matches'">
              <div>
                <template x-if="reconMatches.length === 0">
                  <div class="placeholder">No account matches yet.</div>
                </template>
                <template x-if="reconMatches.length > 0">
                  <table>
                    <thead>
                      <tr>
                        <th>Status</th>
                        <th>SimpleFIN Account</th>
                        <th>LunchFlow Account</th>
                        <th>Confidence</th>
                        <th>Display Name</th>
                        <th>Actions</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="row in reconMatches" :key="row.id">
                        <tr>
                          <td>
                            <template x-if="row.status === 'matched'">
                              <span>
                                <span class="status-badge matched">Matched</span>
                                <template x-if="isUserForced(row)">
                                  <span class="status-badge user" style="margin-left:4px">User</span>
                                </template>
                              </span>
                            </template>
                            <template x-if="row.status === 'sfin_only'">
                              <span class="status-badge sfin-only">SimpleFIN only</span>
                            </template>
                            <template x-if="row.status === 'lf_only'">
                              <span class="status-badge lf-only">LunchFlow only</span>
                            </template>
                          </td>
                          <td x-text="row.sfin_name ?? '—'"></td>
                          <td x-text="row.lf_name ?? '—'"></td>
                          <td class="confidence">
                            <template x-if="row.match_confidence > 0">
                              <span x-text="Math.round(row.match_confidence * 100) + '%'"></span>
                            </template>
                            <template x-if="!row.match_confidence || row.match_confidence === 0">
                              <span>—</span>
                            </template>
                          </td>
                          <td>
                            <template x-if="row.status === 'matched'">
                              <select
                                style="border:1px solid var(--border);border-radius:var(--radius);padding:3px 6px;font-size:12px;font-family:var(--font);background:var(--surface);color:var(--text)"
                                :value="row.preferred_name_source"
                                @change="setNamePreference(row, $event.target.value)"
                              >
                                <option value="simplefin" x-text="row.sfin_name ?? 'SimpleFIN'"></option>
                                <option value="lunchflow" x-text="row.lf_name ?? 'LunchFlow'"></option>
                              </select>
                            </template>
                            <template x-if="row.status !== 'matched'">
                              <span>—</span>
                            </template>
                          </td>
                          <td>
                            <template x-if="row.status === 'matched'">
                              <button class="btn-sm danger" @click="unlinkAccounts(row)">Unlink</button>
                            </template>
                            <template x-if="row.status === 'sfin_only'">
                              <div>
                                <template x-if="linkingMatchId !== row.id">
                                  <button class="btn-sm ghost" @click="startLinking(row)">Link to LunchFlow ▾</button>
                                </template>
                                <template x-if="linkingMatchId === row.id">
                                  <div class="inline-link-form">
                                    <select x-model="linkingTarget">
                                      <option value="">Select account…</option>
                                      <template x-for="a in availableLfAccounts" :key="a.lf_account_id">
                                        <option :value="a.lf_account_id" x-text="a.lf_name"></option>
                                      </template>
                                    </select>
                                    <button class="btn-sm" :disabled="!linkingTarget" @click="confirmLink(row)">Link</button>
                                    <button class="btn-sm ghost" @click="cancelLinking()">Cancel</button>
                                  </div>
                                </template>
                              </div>
                            </template>
                            <template x-if="row.status === 'lf_only'">
                              <div>
                                <template x-if="linkingMatchId !== row.id">
                                  <button class="btn-sm ghost" @click="startLinking(row)">Link to SimpleFIN ▾</button>
                                </template>
                                <template x-if="linkingMatchId === row.id">
                                  <div class="inline-link-form">
                                    <select x-model="linkingTarget">
                                      <option value="">Select account…</option>
                                      <template x-for="a in availableSfinAccounts" :key="a.sfin_account_id">
                                        <option :value="a.sfin_account_id" x-text="a.sfin_name"></option>
                                      </template>
                                    </select>
                                    <button class="btn-sm" :disabled="!linkingTarget" @click="confirmLink(row)">Link</button>
                                    <button class="btn-sm ghost" @click="cancelLinking()">Cancel</button>
                                  </div>
                                </template>
                              </div>
                            </template>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </template>
              </div>
            </template>

            <!-- Rules tab -->
            <template x-if="!reconLoading && !reconError && reconTab === 'rules'">
              <div>
                <!-- Add rule form -->
                <template x-if="!showAddRule">
                  <div style="margin-bottom:16px">
                    <button class="btn" @click="showAddRule = true">+ Add Rule</button>
                  </div>
                </template>
                <template x-if="showAddRule">
                  <div class="recon-form">
                    <label>
                      Action
                      <select x-model="newRuleAction">
                        <option value="match">Force match</option>
                        <option value="exclude">Exclude</option>
                      </select>
                    </label>
                    <label>
                      SimpleFIN Account
                      <select x-model="newRuleSfinId">
                        <option value="">— (any)</option>
                        <template x-for="a in allSfinAccounts" :key="a.sfin_account_id">
                          <option :value="a.sfin_account_id" x-text="a.sfin_name"></option>
                        </template>
                      </select>
                    </label>
                    <label>
                      LunchFlow Account
                      <select x-model="newRuleLfId">
                        <option value="">— (any)</option>
                        <template x-for="a in allLfMatchAccounts" :key="a.lf_account_id">
                          <option :value="a.lf_account_id" x-text="a.lf_name"></option>
                        </template>
                      </select>
                    </label>
                    <div style="display:flex;gap:8px;align-items:center">
                      <button class="btn" :disabled="newRuleSubmitting || !isNewRuleValid" @click="submitAddRule()">Save</button>
                      <button class="btn btn-ghost" @click="cancelAddRule()">Cancel</button>
                      <span class="error-msg" x-show="newRuleError" x-text="newRuleError" style="padding:0"></span>
                    </div>
                  </div>
                </template>

                <template x-if="reconRules.length === 0">
                  <div class="placeholder">No user-defined rules. Rules override automatic reconciliation.</div>
                </template>
                <template x-if="reconRules.length > 0">
                  <table>
                    <thead>
                      <tr>
                        <th>Action</th>
                        <th>SimpleFIN Account</th>
                        <th>LunchFlow Account</th>
                        <th></th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="rule in reconRules" :key="rule.id">
                        <tr>
                          <td>
                            <span class="status-badge" :class="rule.action === 'match' ? 'matched' : 'sfin-only'" x-text="rule.action === 'match' ? 'Force match' : 'Exclude'"></span>
                          </td>
                          <td x-text="sfinNameForId(rule.sfin_account_id) ?? '— (any)'"></td>
                          <td x-text="lfNameForId(rule.lf_account_id) ?? '— (any)'"></td>
                          <td style="text-align:right">
                            <button class="btn-sm danger" @click="deleteRule(rule.id)">Delete</button>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </template>
              </div>
            </template>
          </div>
        </div>
      </template>

    </div>
  </div>

  <!-- Transaction detail modal -->
  <template x-if="txDetail">
    <div class="modal-backdrop" @click.self="txDetail = null">
      <div class="modal">
        <div class="modal-header">
          <div>
            <h3 class="modal-title" x-text="txDetail.payee || txDetail.description"></h3>
            <div class="modal-subtitle">
              <span x-text="fmtDate(txDate(txDetail))"></span>
              &nbsp;·&nbsp;
              <span :class="txDetail.debitCreditMemo === 'CREDIT' ? 'credit' : 'debit'"
                x-text="(txDetail.debitCreditMemo === 'CREDIT' ? '+' : '') + fmt(txDetail.amount, txDetail._currency)"></span>
              <template x-if="txDetail.status === 'PENDING'">
                <span class="badge">pending</span>
              </template>
            </div>
          </div>
          <button class="modal-close" @click="txDetail = null">✕</button>
        </div>

        <div class="modal-sources">
          <!-- SimpleFIN side -->
          <div class="modal-source-card">
            <span class="source-label sfin">SimpleFIN</span>
            <template x-if="txDetail.simplefinTransaction">
              <div style="margin-top:10px">
                <template x-if="txDetail.simplefinTransaction.payee">
                  <div class="detail-row">
                    <span class="detail-key">Payee</span>
                    <span class="detail-val" x-text="txDetail.simplefinTransaction.payee"></span>
                  </div>
                </template>
                <template x-if="txDetail.simplefinTransaction.description">
                  <div class="detail-row">
                    <span class="detail-key">Description</span>
                    <span class="detail-val" x-text="txDetail.simplefinTransaction.description"></span>
                  </div>
                </template>
                <template x-if="txDetail.simplefinTransaction.memo">
                  <div class="detail-row">
                    <span class="detail-key">Memo</span>
                    <span class="detail-val" x-text="txDetail.simplefinTransaction.memo"></span>
                  </div>
                </template>
                <div class="detail-row">
                  <span class="detail-key">Amount</span>
                  <span class="detail-val" :class="txDetail.simplefinTransaction.amount < 0 ? 'debit' : 'credit'"
                    x-text="(txDetail.simplefinTransaction.amount >= 0 ? '+' : '') + fmt(txDetail.simplefinTransaction.amount, txDetail._currency)"></span>
                </div>
                <template x-if="txDetail.simplefinTransaction.postedTimestamp">
                  <div class="detail-row">
                    <span class="detail-key">Posted</span>
                    <span class="detail-val" x-text="fmtDate(txDetail.simplefinTransaction.postedTimestamp)"></span>
                  </div>
                </template>
                <template x-if="txDetail.simplefinTransaction.transactionTimestamp">
                  <div class="detail-row">
                    <span class="detail-key">Authorized</span>
                    <span class="detail-val" x-text="fmtDate(txDetail.simplefinTransaction.transactionTimestamp)"></span>
                  </div>
                </template>
                <div class="detail-row">
                  <span class="detail-key">Status</span>
                  <span class="detail-val" x-text="txDetail.simplefinTransaction.status ?? '—'"></span>
                </div>
                <template x-if="txDetail.simplefinTransaction.transactionId">
                  <div class="detail-row">
                    <span class="detail-key">ID</span>
                    <span class="detail-val" style="font-size:11px;font-family:monospace" x-text="txDetail.simplefinTransaction.transactionId"></span>
                  </div>
                </template>
              </div>
            </template>
            <template x-if="!txDetail.simplefinTransaction">
              <div style="margin-top:10px;color:var(--muted);font-size:13px">No SimpleFIN transaction.</div>
            </template>
          </div>

          <!-- LunchFlow side -->
          <div class="modal-source-card">
            <span class="source-label lf">LunchFlow</span>
            <template x-if="txDetail.lunchflowTransaction">
              <div style="margin-top:10px">
                <template x-if="txDetail.lunchflowTransaction.merchant">
                  <div class="detail-row">
                    <span class="detail-key">Merchant</span>
                    <span class="detail-val" x-text="txDetail.lunchflowTransaction.merchant"></span>
                  </div>
                </template>
                <template x-if="txDetail.lunchflowTransaction.description">
                  <div class="detail-row">
                    <span class="detail-key">Description</span>
                    <span class="detail-val" x-text="txDetail.lunchflowTransaction.description"></span>
                  </div>
                </template>
                <div class="detail-row">
                  <span class="detail-key">Amount</span>
                  <span class="detail-val" :class="txDetail.lunchflowTransaction.amount < 0 ? 'debit' : 'credit'"
                    x-text="(txDetail.lunchflowTransaction.amount >= 0 ? '+' : '') + fmt(txDetail.lunchflowTransaction.amount, txDetail._currency)"></span>
                </div>
                <div class="detail-row">
                  <span class="detail-key">Date</span>
                  <span class="detail-val" x-text="fmtDate(txDetail.lunchflowTransaction.date)"></span>
                </div>
                <div class="detail-row">
                  <span class="detail-key">Pending</span>
                  <span class="detail-val" x-text="txDetail.lunchflowTransaction.isPending ? 'Yes' : 'No'"></span>
                </div>
                <template x-if="txDetail.lunchflowTransaction.transactionId">
                  <div class="detail-row">
                    <span class="detail-key">ID</span>
                    <span class="detail-val" style="font-size:11px;font-family:monospace" x-text="txDetail.lunchflowTransaction.transactionId"></span>
                  </div>
                </template>
              </div>
            </template>
            <template x-if="!txDetail.lunchflowTransaction">
              <div style="margin-top:10px;color:var(--muted);font-size:13px">No LunchFlow transaction.</div>
            </template>
          </div>
        </div>

        <div class="modal-match-row">
          <span>Status: <strong x-text="txDetail.reconciliationStatus ?? '—'"></strong></span>
          <template x-if="txDetail.matchConfidence != null">
            <span>Match confidence: <strong x-text="Math.round(txDetail.matchConfidence * 100) + '%'"></strong></span>
          </template>
          <template x-if="txDetail.transactionId">
            <span style="margin-left:auto;font-size:11px;font-family:monospace;color:var(--muted)" x-text="txDetail.transactionId"></span>
          </template>
        </div>
      </div>
    </div>
  </template>

  <script>
    const PAGE_SIZE = 30;
    const OVERVIEW_DAYS = 90;

    function app() {
      return {
        // Nav
        view: 'overview',
        sidebarOpen: false,

        // Accounts
        accounts: [],
        accountsError: null,
        selected: null,

        // Account detail
        tab: 'transactions',
        transactions: [],
        txLoading: false,
        txError: null,
        holdings: [],
        holdingsLoading: false,
        holdingsError: null,
        startDate: '',
        endDate: '',

        // Transaction detail modal
        txDetail: null,

        // Overview
        overviewPending: [],
        overviewPosted: [],
        displayItems: [],   // pending first, then posted — recomputed on load/filter change
        overviewPage: 0,
        overviewFilter: 'all',
        overviewLoading: false,
        overviewError: null,

        // Status
        status: 'Loading…',
        statusError: false,

        // Reconciliation management
        reconTab: 'matches',
        reconMatches: [],
        reconRules: [],
        reconLoading: false,
        reconRunning: false,
        reconError: null,
        // Inline link picker
        linkingMatchId: null,
        linkingRow: null,
        linkingTarget: '',
        // Add rule form
        showAddRule: false,
        newRuleAction: 'match',
        newRuleSfinId: '',
        newRuleLfId: '',
        newRuleSubmitting: false,
        newRuleError: null,

        get lunchflowPresent() {
          return this.accounts.some(a => a.accountId.startsWith('LUNCHFLOW-') || a.accountId.startsWith('REC-'));
        },

        get reconAccounts() {
          return this.accounts.filter(a => a.accountId.startsWith('REC-'));
        },

        get sfinAccounts() {
          const reconciled = new Set(this.reconAccounts.map(a => a.simplefinAccountId).filter(Boolean));
          return this.accounts.filter(a => a.accountId.startsWith('SIMPLEFIN-') && !reconciled.has(a.accountId));
        },

        get lfAccounts() {
          const reconciled = new Set(this.reconAccounts.map(a => a.lunchflowAccountId).filter(Boolean));
          return this.accounts.filter(a => a.accountId.startsWith('LUNCHFLOW-') && !reconciled.has(a.accountId));
        },

        applyOverviewFilter() {
          const rec = this.overviewFilter === 'reconciled';
          const pending = rec
            ? this.overviewPending.filter(tx => tx._accountId.startsWith('REC-'))
            : this.overviewPending;
          const posted = rec
            ? this.overviewPosted.filter(tx => tx._accountId.startsWith('REC-'))
            : this.overviewPosted;
          this.displayItems = [...pending, ...posted];
        },

        setOverviewFilter(f) {
          this.overviewFilter = f;
          this.overviewPage = 0;
          this.applyOverviewFilter();
        },

        // Reconciliation computed helpers
        get reconMatchedCount() {
          return this.reconMatches.filter(r => r.status === 'matched').length;
        },
        get reconSfinOnlyCount() {
          return this.reconMatches.filter(r => r.status === 'sfin_only').length;
        },
        get reconLfOnlyCount() {
          return this.reconMatches.filter(r => r.status === 'lf_only').length;
        },
        isUserForced(row) {
          return this.reconRules.some(r =>
            r.action === 'match' &&
            r.sfin_account_id === row.sfin_account_id &&
            r.lf_account_id === row.lf_account_id
          );
        },
        // All sfin accounts from matches (for dropdowns)
        get allSfinAccounts() {
          return this.reconMatches
            .filter(r => r.sfin_account_id)
            .map(r => ({ sfin_account_id: r.sfin_account_id, sfin_name: r.sfin_name }))
            .filter((v, i, arr) => arr.findIndex(x => x.sfin_account_id === v.sfin_account_id) === i);
        },
        // All lf accounts from matches (for dropdowns)
        get allLfMatchAccounts() {
          return this.reconMatches
            .filter(r => r.lf_account_id)
            .map(r => ({ lf_account_id: r.lf_account_id, lf_name: r.lf_name }))
            .filter((v, i, arr) => arr.findIndex(x => x.lf_account_id === v.lf_account_id) === i);
        },
        // Unmatched lf accounts available for linking
        get availableLfAccounts() {
          const matchedLfIds = new Set(
            this.reconMatches.filter(r => r.status === 'matched').map(r => r.lf_account_id)
          );
          return this.allLfMatchAccounts.filter(a => !matchedLfIds.has(a.lf_account_id));
        },
        // Unmatched sfin accounts available for linking
        get availableSfinAccounts() {
          const matchedSfinIds = new Set(
            this.reconMatches.filter(r => r.status === 'matched').map(r => r.sfin_account_id)
          );
          return this.allSfinAccounts.filter(a => !matchedSfinIds.has(a.sfin_account_id));
        },
        sfinNameForId(id) {
          if (!id) return null;
          const found = this.reconMatches.find(r => r.sfin_account_id === id);
          return found?.sfin_name ?? id;
        },
        lfNameForId(id) {
          if (id == null) return null;
          const found = this.reconMatches.find(r => r.lf_account_id === id);
          return found?.lf_name ?? String(id);
        },
        get isNewRuleValid() {
          if (!this.newRuleSfinId && !this.newRuleLfId) return false;
          if (this.newRuleAction === 'match' && (!this.newRuleSfinId || !this.newRuleLfId)) return false;
          return true;
        },

        get overviewPagedItems() {
          const start = this.overviewPage * PAGE_SIZE;
          return this.displayItems.slice(start, start + PAGE_SIZE);
        },

        get overviewTotalPages() {
          return Math.max(1, Math.ceil(this.displayItems.length / PAGE_SIZE));
        },

        get overviewSubtitle() {
          const p = this.overviewPending.length;
          const n = this.overviewPosted.length;
          const parts = [];
          if (p > 0) parts.push(`${p} pending`);
          parts.push(`${n} posted (last ${OVERVIEW_DAYS} days)`);
          return parts.join(' · ');
        },

        init() {
          const end = new Date();
          const start = new Date();
          start.setDate(start.getDate() - 30);
          this.endDate = end.toISOString().slice(0, 10);
          this.startDate = start.toISOString().slice(0, 10);
          this.refreshStatus();
          this.loadAccounts();
          setInterval(() => this.refreshStatus(), 60_000);
          document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { this.txDetail = null; this.sidebarOpen = false; } });
        },

        async refreshStatus() {
          try {
            const h = await fetch('/health').then(r => r.json());
            if (h.fetchError) {
              this.status = 'Fetch error: ' + h.fetchError;
              this.statusError = true;
            } else if (h.lastFetched) {
              const ago = Math.round((Date.now() / 1000 - new Date(h.lastFetched).getTime() / 1000) / 60);
              this.status = ago < 2 ? 'Updated just now' : `Updated ${ago}m ago`;
              this.statusError = false;
            } else {
              this.status = 'Waiting for first fetch…';
              this.statusError = false;
            }
          } catch {
            this.status = 'Server unreachable';
            this.statusError = true;
          }
        },

        async loadAccounts() {
          try {
            const d = await fetch('/fdx/v6/accounts').then(r => r.json());
            this.accounts = d.accounts ?? [];
            await this.loadOverview();
          } catch (e) {
            this.accountsError = e.message;
          }
        },

        async selectOverview() {
          this.sidebarOpen = false;
          this.view = 'overview';
          this.selected = null;
          this.overviewPage = 0;
          if (this.overviewPosted.length === 0 && this.overviewPending.length === 0 && !this.overviewLoading) {
            await this.loadOverview();
          }
        },

        async selectAccount(acct) {
          this.sidebarOpen = false;
          this.view = 'account';
          this.selected = acct;
          this.tab = 'transactions';
          await this.loadTransactions();
        },

        async loadOverview() {
          if (this.accounts.length === 0) return;
          this.overviewLoading = true;
          this.overviewError = null;
          this.overviewPage = 0;

          const end = new Date();
          const start = new Date();
          start.setDate(start.getDate() - OVERVIEW_DAYS);
          const startIso = start.toISOString().slice(0, 10) + 'T00:00:00Z';
          const endIso = end.toISOString().slice(0, 10) + 'T23:59:59Z';

          try {
            // Build the set of source account IDs claimed by a REC- account so
            // we don't also fetch their transactions from the raw source endpoints.
            const claimedByRec = new Set(
              this.accounts
                .filter(a => a.accountId.startsWith('REC-'))
                .flatMap(a => [a.simplefinAccountId, a.lunchflowAccountId])
                .filter(Boolean)
            );
            const visibleAccounts = this.accounts.filter(a =>
              a.accountId.startsWith('REC-') || !claimedByRec.has(a.accountId)
            );
            const results = await Promise.all(visibleAccounts.map(async acct => {
              const url = `/fdx/v6/accounts/${encodeURIComponent(acct.accountId)}/transactions`
                + `?startTime=${encodeURIComponent(startIso)}&endTime=${encodeURIComponent(endIso)}`;
              const d = await fetch(url).then(r => r.json());
              const currency = acct.currency?.currencyCode ?? 'USD';
              return (d.transactions ?? []).map(tx => ({
                ...tx,
                _accountId: acct.accountId,
                _accountName: acct.displayName,
                _currency: currency,
              }));
            }));

            const all = results.flat();
            this.overviewPending = all.filter(tx => tx.status === 'PENDING');
            this.overviewPosted = all
              .filter(tx => tx.status !== 'PENDING')
              .sort((a, b) => new Date(b.postedTimestamp) - new Date(a.postedTimestamp));
            this.applyOverviewFilter();
          } catch (e) {
            this.overviewError = e.message;
          } finally {
            this.overviewLoading = false;
          }
        },

        async switchTab(tab) {
          this.tab = tab;
          if (tab === 'transactions') await this.loadTransactions();
          else await this.loadHoldings();
        },

        async loadTransactions() {
          if (!this.selected) return;
          this.txLoading = true;
          this.txError = null;
          this.transactions = [];
          try {
            const startIso = this.startDate + 'T00:00:00Z';
            const endIso = this.endDate + 'T23:59:59Z';
            const url = `/fdx/v6/accounts/${encodeURIComponent(this.selected.accountId)}/transactions`
              + `?startTime=${encodeURIComponent(startIso)}&endTime=${encodeURIComponent(endIso)}`;
            const d = await fetch(url).then(r => r.json());
            this.transactions = d.transactions ?? [];
          } catch (e) {
            this.txError = e.message;
          } finally {
            this.txLoading = false;
          }
        },

        async loadHoldings() {
          if (!this.selected) return;
          this.holdingsLoading = true;
          this.holdingsError = null;
          this.holdings = [];
          try {
            const d = await fetch(`/fdx/v6/accounts/${encodeURIComponent(this.selected.accountId)}/holdings`).then(r => r.json());
            this.holdings = d.holdings ?? [];
          } catch (e) {
            this.holdingsError = e.message;
          } finally {
            this.holdingsLoading = false;
          }
        },

        async setNamePreference(row, preferredSource) {
          row.preferred_name_source = preferredSource;
          await fetch(`/api/reconciliation/name-preference/${encodeURIComponent(row.sfin_account_id)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ preferred_source: preferredSource }),
          });
          // Reload accounts so the sidebar and header reflect the new name.
          await this.loadAccounts();
        },

        async runReconciliation() {
          this.reconRunning = true;
          try {
            await fetch('/api/reconciliation/run', { method: 'POST' });
            await this.loadReconciliationData();
            await this.loadAccounts();
          } finally {
            this.reconRunning = false;
          }
        },

        async selectReconciliation() {
          this.sidebarOpen = false;
          this.view = 'reconciliation';
          this.selected = null;
          await this.loadReconciliationData();
        },

        async loadReconciliationData() {
          this.reconLoading = true;
          this.reconError = null;
          try {
            const [matches, rules] = await Promise.all([
              fetch('/api/reconciliation/account-matches').then(r => r.json()),
              fetch('/api/reconciliation/account-rules').then(r => r.json()),
            ]);
            this.reconMatches = matches;
            this.reconRules = rules;
          } catch (e) {
            this.reconError = e.message;
          } finally {
            this.reconLoading = false;
          }
        },

        startLinking(row) {
          this.linkingMatchId = row.id;
          this.linkingRow = row;
          this.linkingTarget = '';
        },

        cancelLinking() {
          this.linkingMatchId = null;
          this.linkingRow = null;
          this.linkingTarget = '';
        },

        async confirmLink(row) {
          if (!this.linkingTarget) return;
          const sfinId = row.status === 'sfin_only' ? row.sfin_account_id : this.linkingTarget;
          const lfId = row.status === 'lf_only' ? row.lf_account_id : parseInt(this.linkingTarget, 10);
          await this.addRule('match', sfinId, lfId);
          this.cancelLinking();
        },

        async addRule(action, sfinId, lfId) {
          const body = { action };
          if (sfinId) body.sfin_account_id = sfinId;
          if (lfId != null) body.lf_account_id = lfId;
          const res = await fetch('/api/reconciliation/account-rules', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({ error: 'Request failed' }));
            throw new Error(err.error ?? 'Request failed');
          }
          await this.loadReconciliationData();
          // Reload accounts so the sidebar reflects the new match.
          await this.loadAccounts();
        },

        async unlinkAccounts(row) {
          // If there's a user-forced match rule, delete it.
          const rule = this.reconRules.find(r =>
            r.action === 'match' &&
            r.sfin_account_id === row.sfin_account_id &&
            r.lf_account_id === row.lf_account_id
          );
          if (rule) {
            await this.deleteRule(rule.id);
            return;
          }
          // Otherwise create an exclude rule to block the auto-match.
          await this.addRule('exclude', row.sfin_account_id, row.lf_account_id);
        },

        async submitAddRule() {
          this.newRuleSubmitting = true;
          this.newRuleError = null;
          try {
            await this.addRule(
              this.newRuleAction,
              this.newRuleSfinId || null,
              this.newRuleLfId ? parseInt(this.newRuleLfId, 10) : null,
            );
            this.cancelAddRule();
          } catch (e) {
            this.newRuleError = e.message;
          } finally {
            this.newRuleSubmitting = false;
          }
        },

        cancelAddRule() {
          this.showAddRule = false;
          this.newRuleAction = 'match';
          this.newRuleSfinId = '';
          this.newRuleLfId = '';
          this.newRuleError = null;
        },

        async deleteRule(id) {
          await fetch(`/api/reconciliation/account-rules/${id}`, { method: 'DELETE' });
          await this.loadReconciliationData();
          await this.loadAccounts();
        },

        openTxDetail(tx) {
          const accountId = tx._accountId ?? this.selected?.accountId ?? '';
          const currency = tx._currency ?? this.selected?.currency?.currencyCode ?? 'USD';
          const detail = { ...tx, _accountId: accountId, _currency: currency };

          if (tx.reconciliationStatus !== 'matched') {
            const isLf = tx.reconciliationStatus === 'lf_only' || accountId.startsWith('LUNCHFLOW-');
            if (isLf) {
              detail.lunchflowTransaction = {
                merchant: tx.payee || null,
                description: tx.description || null,
                amount: tx.amount,
                date: (tx.postedTimestamp ?? tx.transactionTimestamp ?? '').slice(0, 10) || null,
                isPending: tx.status === 'PENDING',
                transactionId: tx.transactionId,
              };
            } else {
              detail.simplefinTransaction = {
                payee: tx.payee || null,
                description: tx.description || null,
                memo: tx.memo || null,
                amount: tx.amount,
                postedTimestamp: tx.postedTimestamp || null,
                transactionTimestamp: tx.transactionTimestamp || null,
                status: tx.status,
                transactionId: tx.transactionId,
              };
            }
          }

          this.txDetail = detail;
        },

        fmt(amount, currency) {
          return new Intl.NumberFormat('en-US', {
            style: 'currency',
            currency: currency ?? 'USD',
          }).format(amount);
        },

        // Returns the best displayable date for a transaction, preferring the
        // structurally correct field but falling back to the other when it
        // contains epoch (1970) or is absent, then to the nested LunchFlow date.
        txDate(tx) {
          const ok = iso => !!iso && new Date(iso).getFullYear() > 1970;
          const a = tx.status === 'PENDING' ? tx.transactionTimestamp : tx.postedTimestamp;
          const b = tx.status === 'PENDING' ? tx.postedTimestamp : tx.transactionTimestamp;
          const lfDate = tx.lunchflowTransaction?.date;
          const result = ok(a) ? a : ok(b) ? b : ok(lfDate) ? lfDate : a;
          if (!ok(result)) {
            console.warn('[txDate] no valid date found', {
              txId: tx.transactionId,
              status: tx.status,
              postedTimestamp: tx.postedTimestamp,
              transactionTimestamp: tx.transactionTimestamp,
              lfDate,
              postedYear: tx.postedTimestamp ? new Date(tx.postedTimestamp).getFullYear() : null,
              hasLfTx: !!tx.lunchflowTransaction,
              result,
            });
          }
          return result;
        },

        fmtDate(iso) {
          if (!iso) return '—';
          return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        },

        fmtDateShort(iso) {
          if (!iso) return '—';
          return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        },
      };
    }
  </script>
