<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimpleFIN</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg: #f8f9fa;
      --surface: #ffffff;
      --border: #dee2e6;
      --muted: #6c757d;
      --text: #212529;
      --primary: #0d6efd;
      --primary-text: #ffffff;
      --danger: #dc3545;
      --success: #198754;
      --hover: #f1f3f5;
      --active-bg: #e7f1ff;
      --active-text: #0a58ca;
      --radius: 6px;
      --font: system-ui, -apple-system, sans-serif;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: var(--font);
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
    }

    #layout { display: flex; height: 100%; }

    /* ── Sidebar ── */
    #sidebar {
      width: 240px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
    }

    #sidebar-header {
      padding: 16px 14px 12px;
      border-bottom: 1px solid var(--border);
    }

    #sidebar-header h1 { margin: 0 0 4px; font-size: 16px; font-weight: 700; }

    #status { font-size: 12px; color: var(--muted); }
    #status.error { color: var(--danger); }

    .sidebar-section {
      padding: 8px 6px;
    }

    .sidebar-section + .sidebar-section {
      border-top: 1px solid var(--border);
    }

    .sidebar-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      padding: 4px 10px 6px;
    }

    .sidebar-btn {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      padding: 8px 10px;
      border: none;
      background: none;
      border-radius: var(--radius);
      cursor: pointer;
      text-align: left;
      color: var(--text);
      font-size: 14px;
    }

    .sidebar-btn:hover { background: var(--hover); }

    .sidebar-btn.active {
      background: var(--active-bg);
      color: var(--active-text);
      font-weight: 600;
    }

    .acct-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .acct-bal {
      font-size: 12px;
      white-space: nowrap;
      flex-shrink: 0;
      color: var(--muted);
    }

    .sidebar-btn.active .acct-bal { color: var(--active-text); }

    /* ── Main ── */
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    #main-header {
      padding: 20px 24px 0;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    #main-header h2 { margin: 0 0 4px; font-size: 18px; font-weight: 700; }

    .balance-row { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
    .balance-row strong { color: var(--text); }

    .tab-bar { display: flex; gap: 2px; margin-top: 4px; }

    .tab-bar button {
      padding: 8px 14px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }

    .tab-bar button:hover { color: var(--text); }

    .tab-bar button.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      font-weight: 600;
    }

    /* ── Content ── */
    #content { flex: 1; overflow-y: auto; padding: 20px 24px; }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .filter-bar label {
      font-size: 13px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filter-bar input[type="date"] {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 5px 8px;
      font-size: 13px;
      font-family: var(--font);
      background: var(--surface);
      color: var(--text);
    }

    .filter-bar button, .btn {
      padding: 5px 14px;
      background: var(--primary);
      color: var(--primary-text);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 13px;
    }

    .filter-bar button:hover, .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn-ghost {
      background: none;
      color: var(--primary);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--hover); opacity: 1; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }

    thead th {
      text-align: left;
      padding: 8px 12px;
      border-bottom: 2px solid var(--border);
      font-weight: 600;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    tbody tr:hover { background: var(--hover); }

    tbody td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .text-right { text-align: right; }
    .text-nowrap { white-space: nowrap; }

    .debit { color: var(--danger); }
    .credit { color: var(--success); }

    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--hover);
      color: var(--muted);
      margin-left: 6px;
      vertical-align: middle;
    }

    .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .placeholder { text-align: center; color: var(--muted); padding: 60px 0; }
    .error-msg { color: var(--danger); padding: 16px 0; }

    .pagination {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
    }

    /* ── Expandable reconciled transactions ── */
    .tx-expandable { cursor: pointer; }
    .tx-expandable:hover { background: var(--hover); }

    .tx-expand-icon {
      display: inline-block;
      width: 14px;
      font-size: 10px;
      color: var(--muted);
      margin-right: 2px;
      transition: transform 0.15s;
      vertical-align: middle;
    }

    .tx-source-row > td {
      background: #f4f6ff;
      padding: 8px 12px 8px 28px;
      border-bottom: 1px solid var(--border);
    }

    .source-txns {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .source-item {
      display: grid;
      grid-template-columns: 80px 80px 1fr auto;
      align-items: center;
      gap: 12px;
      font-size: 12px;
    }

    .source-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 1px 5px;
      border-radius: 3px;
      background: var(--hover);
      color: var(--muted);
    }

    .source-label.sfin { background: #dbeafe; color: #1d4ed8; }
    .source-label.lf   { background: #dcfce7; color: #166534; }

    .source-desc { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .source-amount { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }

    /* ── Reconciliation management ── */
    .recon-stat {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      margin-right: 16px;
    }

    .status-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .status-badge.matched  { background: #dcfce7; color: #166534; }
    .status-badge.sfin-only { background: #dbeafe; color: #1d4ed8; }
    .status-badge.lf-only  { background: #fef9c3; color: #854d0e; }
    .status-badge.user     { background: #f3e8ff; color: #6b21a8; }

    .recon-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
    }

    .recon-form label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .recon-form select, .recon-form input {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 8px;
      font-size: 13px;
      font-family: var(--font);
      background: var(--surface);
      color: var(--text);
      min-width: 160px;
    }

    .inline-link-form {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .inline-link-form select {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px 8px;
      font-size: 12px;
      font-family: var(--font);
      background: var(--surface);
      color: var(--text);
    }

    .btn-sm {
      padding: 4px 10px;
      font-size: 12px;
      background: var(--primary);
      color: var(--primary-text);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
    }

    .btn-sm:hover { opacity: 0.9; }

    .btn-sm.danger {
      background: var(--danger);
    }

    .btn-sm.ghost {
      background: none;
      color: var(--primary);
      border: 1px solid var(--border);
    }

    .btn-sm.ghost:hover { background: var(--hover); opacity: 1; }

    .confidence { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body x-data="app()" x-init="init()">
  <div id="layout">

    <!-- Sidebar -->
    <div id="sidebar">
      <div id="sidebar-header">
        <h1>SimpleFIN</h1>
        <div id="status" :class="{ error: statusError }" x-text="status"></div>
      </div>

      <!-- Overview nav -->
      <div class="sidebar-section">
        <button class="sidebar-btn" :class="{ active: view === 'overview' }" @click="selectOverview()">
          Overview
        </button>
        <template x-if="lunchflowPresent">
          <button class="sidebar-btn" :class="{ active: view === 'reconciliation' }" @click="selectReconciliation()">
            Reconciliation
          </button>
        </template>
      </div>

      <!-- Account list -->
      <template x-if="accounts.length === 0 && !accountsError">
        <div class="sidebar-section">
          <div class="placeholder" style="padding:16px 10px;font-size:13px">Loading…</div>
        </div>
      </template>
      <template x-if="accountsError">
        <div class="sidebar-section">
          <div class="error-msg" style="padding:12px 10px" x-text="accountsError"></div>
        </div>
      </template>

      <template x-if="reconAccounts.length > 0">
        <div class="sidebar-section">
          <div class="sidebar-label">Reconciled</div>
          <template x-for="acct in reconAccounts" :key="acct.accountId">
            <button class="sidebar-btn" :class="{ active: view === 'account' && selected?.accountId === acct.accountId }" @click="selectAccount(acct)">
              <span class="acct-name" x-text="acct.displayName"></span>
              <span class="acct-bal" x-text="fmt(acct.currentBalance, acct.currency?.currencyCode)"></span>
            </button>
          </template>
        </div>
      </template>

      <template x-if="sfinAccounts.length > 0">
        <div class="sidebar-section">
          <div class="sidebar-label">SimpleFIN</div>
          <template x-for="acct in sfinAccounts" :key="acct.accountId">
            <button class="sidebar-btn" :class="{ active: view === 'account' && selected?.accountId === acct.accountId }" @click="selectAccount(acct)">
              <span class="acct-name" x-text="acct.displayName"></span>
              <span class="acct-bal" x-text="fmt(acct.currentBalance, acct.currency?.currencyCode)"></span>
            </button>
          </template>
        </div>
      </template>

      <template x-if="lfAccounts.length > 0">
        <div class="sidebar-section">
          <div class="sidebar-label">LunchFlow</div>
          <template x-for="acct in lfAccounts" :key="acct.accountId">
            <button class="sidebar-btn" :class="{ active: view === 'account' && selected?.accountId === acct.accountId }" @click="selectAccount(acct)">
              <span class="acct-name" x-text="acct.displayName"></span>
              <span class="acct-bal" x-text="fmt(acct.currentBalance, acct.currency?.currencyCode)"></span>
            </button>
          </template>
        </div>
      </template>
    </div>

    <!-- Main panel -->
    <div id="main">

      <!-- Overview -->
      <template x-if="view === 'overview'">
        <div style="display:flex;flex-direction:column;height:100%">
          <div id="main-header">
            <h2>Overview</h2>
            <div class="balance-row"><span x-text="overviewSubtitle"></span></div>
            <div class="tab-bar">
              <button @click="setOverviewFilter('all')" :class="{ active: overviewFilter === 'all' }">All accounts</button>
              <button @click="setOverviewFilter('reconciled')" :class="{ active: overviewFilter === 'reconciled' }">Reconciled only</button>
            </div>
          </div>
          <div id="content">
            <template x-if="overviewLoading">
              <div class="placeholder">Loading…</div>
            </template>
            <template x-if="overviewError">
              <div class="error-msg" x-text="overviewError"></div>
            </template>
            <template x-if="!overviewLoading && !overviewError && displayItems.length === 0">
              <div class="placeholder">No transactions found.</div>
            </template>
            <template x-if="!overviewLoading && !overviewError && displayItems.length > 0">
              <div>
                <table>
                  <thead>
                    <tr>
                      <th>Date</th>
                      <th>Account</th>
                      <th>Description</th>
                      <th class="text-right">Amount</th>
                    </tr>
                  </thead>
                  <template x-for="tx in overviewPagedItems" :key="tx.transactionId">
                    <tbody>
                      <tr
                        :class="{ 'tx-expandable': tx.reconciliationStatus === 'matched' }"
                        @click="tx.reconciliationStatus === 'matched' && toggleExpand(tx.transactionId)"
                      >
                        <td class="text-nowrap">
                          <span x-text="fmtDateShort(tx.status === 'PENDING' ? tx.transactionTimestamp : tx.postedTimestamp)"></span>
                          <template x-if="tx.status === 'PENDING'">
                            <div style="font-size:11px;color:var(--muted)">authorized</div>
                          </template>
                        </td>
                        <td class="text-nowrap" style="color:var(--muted)" x-text="tx._accountName"></td>
                        <td>
                          <div>
                            <template x-if="tx.reconciliationStatus === 'matched'">
                              <span class="tx-expand-icon" x-text="expandedTxns[tx.transactionId] ? '▼' : '▶'"></span>
                            </template>
                            <span x-text="tx.payee || tx.description"></span>
                            <template x-if="tx.status === 'PENDING'">
                              <span class="badge">pending</span>
                            </template>
                          </div>
                          <template x-if="tx.payee && tx.description !== tx.payee">
                            <div class="sub" x-text="tx.description"></div>
                          </template>
                        </td>
                        <td class="text-right text-nowrap"
                            :class="tx.debitCreditMemo === 'CREDIT' ? 'credit' : 'debit'"
                            x-text="(tx.debitCreditMemo === 'CREDIT' ? '+' : '') + fmt(tx.amount, tx._currency)">
                        </td>
                      </tr>
                      <tr x-show="expandedTxns[tx.transactionId]" class="tx-source-row">
                        <td colspan="4">
                          <div class="source-txns">
                            <template x-if="tx.simplefinTransaction">
                              <div class="source-item">
                                <span class="source-label sfin">SimpleFIN</span>
                                <span x-text="fmtDateShort(tx.simplefinTransaction.postedTimestamp)"></span>
                                <span class="source-desc" x-text="tx.simplefinTransaction.payee || tx.simplefinTransaction.description || '—'"></span>
                                <span class="source-amount" :class="tx.simplefinTransaction.amount < 0 ? 'debit' : 'credit'"
                                  x-text="(tx.simplefinTransaction.amount >= 0 ? '+' : '') + fmt(tx.simplefinTransaction.amount, tx._currency)"></span>
                              </div>
                            </template>
                            <template x-if="tx.lunchflowTransaction">
                              <div class="source-item">
                                <span class="source-label lf">LunchFlow</span>
                                <span x-text="fmtDate(tx.lunchflowTransaction.date)"></span>
                                <span class="source-desc" x-text="tx.lunchflowTransaction.merchant || tx.lunchflowTransaction.description || '—'"></span>
                                <span class="source-amount" :class="tx.lunchflowTransaction.amount < 0 ? 'debit' : 'credit'"
                                  x-text="(tx.lunchflowTransaction.amount >= 0 ? '+' : '') + fmt(tx.lunchflowTransaction.amount, tx._currency)"></span>
                              </div>
                            </template>
                          </div>
                        </td>
                      </tr>
                    </tbody>
                  </template>
                </table>

                <!-- Pagination -->
                <template x-if="overviewTotalPages > 1">
                  <div class="pagination">
                    <button class="btn btn-ghost" :disabled="overviewPage === 0" @click="overviewPage--">← Prev</button>
                    <span>Page <span x-text="overviewPage + 1"></span> of <span x-text="overviewTotalPages"></span></span>
                    <button class="btn btn-ghost" :disabled="overviewPage >= overviewTotalPages - 1" @click="overviewPage++">Next →</button>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- Account detail -->
      <template x-if="view === 'account' && selected">
        <div style="display:flex;flex-direction:column;height:100%">
          <div id="main-header">
            <h2 x-text="selected.displayName"></h2>
            <div class="balance-row">
              Balance: <strong x-text="fmt(selected.currentBalance, selected.currency?.currencyCode)"></strong>
              <template x-if="selected.availableBalance != null">
                <span> &nbsp;·&nbsp; Available: <strong x-text="fmt(selected.availableBalance, selected.currency?.currencyCode)"></strong></span>
              </template>
              &nbsp;·&nbsp; as of <span x-text="fmtDate(selected.balanceDate)"></span>
            </div>
            <div class="tab-bar">
              <button @click="switchTab('transactions')" :class="{ active: tab === 'transactions' }">Transactions</button>
              <button @click="switchTab('holdings')" :class="{ active: tab === 'holdings' }">Holdings</button>
            </div>
          </div>

          <div id="content">

            <!-- Transactions tab -->
            <template x-if="tab === 'transactions'">
              <div>
                <div class="filter-bar">
                  <label>From <input type="date" x-model="startDate" /></label>
                  <label>To <input type="date" x-model="endDate" /></label>
                  <button @click="loadTransactions()">Apply</button>
                </div>

                <template x-if="txLoading">
                  <div class="placeholder">Loading…</div>
                </template>
                <template x-if="txError">
                  <div class="error-msg" x-text="txError"></div>
                </template>
                <template x-if="!txLoading && !txError && transactions.length === 0">
                  <div class="placeholder">No transactions in this date range.</div>
                </template>
                <template x-if="!txLoading && !txError && transactions.length > 0">
                  <table>
                    <thead>
                      <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th class="text-right">Amount</th>
                      </tr>
                    </thead>
                    <template x-for="tx in transactions" :key="tx.transactionId">
                      <tbody>
                        <tr
                          :class="{ 'tx-expandable': tx.reconciliationStatus === 'matched' }"
                          @click="tx.reconciliationStatus === 'matched' && toggleExpand(tx.transactionId)"
                        >
                          <td class="text-nowrap">
                            <span x-text="fmtDateShort(tx.status === 'PENDING' ? tx.transactionTimestamp : tx.postedTimestamp)"></span>
                            <template x-if="tx.status === 'PENDING'">
                              <div style="font-size:11px;color:var(--muted)">authorized</div>
                            </template>
                          </td>
                          <td>
                            <div>
                              <template x-if="tx.reconciliationStatus === 'matched'">
                                <span class="tx-expand-icon" x-text="expandedTxns[tx.transactionId] ? '▼' : '▶'"></span>
                              </template>
                              <span x-text="tx.payee || tx.description"></span>
                              <template x-if="tx.status === 'PENDING'">
                                <span class="badge">pending</span>
                              </template>
                            </div>
                            <template x-if="tx.payee && tx.description !== tx.payee">
                              <div class="sub" x-text="tx.description"></div>
                            </template>
                          </td>
                          <td class="text-right text-nowrap"
                              :class="tx.debitCreditMemo === 'CREDIT' ? 'credit' : 'debit'"
                              x-text="(tx.debitCreditMemo === 'CREDIT' ? '+' : '') + fmt(tx.amount, selected.currency?.currencyCode)">
                          </td>
                        </tr>
                        <tr x-show="expandedTxns[tx.transactionId]" class="tx-source-row">
                          <td colspan="3">
                            <div class="source-txns">
                              <template x-if="tx.simplefinTransaction">
                                <div class="source-item">
                                  <span class="source-label sfin">SimpleFIN</span>
                                  <span x-text="fmtDateShort(tx.simplefinTransaction.postedTimestamp)"></span>
                                  <span class="source-desc" x-text="tx.simplefinTransaction.payee || tx.simplefinTransaction.description || '—'"></span>
                                  <span class="source-amount" :class="tx.simplefinTransaction.amount < 0 ? 'debit' : 'credit'"
                                    x-text="(tx.simplefinTransaction.amount >= 0 ? '+' : '') + fmt(tx.simplefinTransaction.amount, selected.currency?.currencyCode)"></span>
                                </div>
                              </template>
                              <template x-if="tx.lunchflowTransaction">
                                <div class="source-item">
                                  <span class="source-label lf">LunchFlow</span>
                                  <span x-text="fmtDate(tx.lunchflowTransaction.date)"></span>
                                  <span class="source-desc" x-text="tx.lunchflowTransaction.merchant || tx.lunchflowTransaction.description || '—'"></span>
                                  <span class="source-amount" :class="tx.lunchflowTransaction.amount < 0 ? 'debit' : 'credit'"
                                    x-text="(tx.lunchflowTransaction.amount >= 0 ? '+' : '') + fmt(tx.lunchflowTransaction.amount, selected.currency?.currencyCode)"></span>
                                </div>
                              </template>
                            </div>
                          </td>
                        </tr>
                      </tbody>
                    </template>
                  </table>
                </template>
              </div>
            </template>

            <!-- Holdings tab -->
            <template x-if="tab === 'holdings'">
              <div>
                <template x-if="holdingsLoading">
                  <div class="placeholder">Loading…</div>
                </template>
                <template x-if="holdingsError">
                  <div class="error-msg" x-text="holdingsError"></div>
                </template>
                <template x-if="!holdingsLoading && !holdingsError && holdings.length === 0">
                  <div class="placeholder">No holdings for this account.</div>
                </template>
                <template x-if="!holdingsLoading && !holdingsError && holdings.length > 0">
                  <table>
                    <thead>
                      <tr>
                        <th>Symbol</th>
                        <th>Description</th>
                        <th class="text-right">Shares</th>
                        <th class="text-right">Market Value</th>
                        <th class="text-right">Cost Basis</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="h in holdings" :key="h.holdingId">
                        <tr>
                          <td><strong x-text="h.symbol ?? '—'"></strong></td>
                          <td x-text="h.description ?? '—'"></td>
                          <td class="text-right text-nowrap" x-text="h.units != null ? h.units.toFixed(4) : '—'"></td>
                          <td class="text-right text-nowrap" x-text="h.marketValue != null ? fmt(h.marketValue, selected.currency?.currencyCode) : '—'"></td>
                          <td class="text-right text-nowrap" x-text="h.costBasis != null ? fmt(h.costBasis, selected.currency?.currencyCode) : '—'"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </template>
              </div>
            </template>

          </div>
        </div>
      </template>

      <!-- Reconciliation management -->
      <template x-if="view === 'reconciliation'">
        <div style="display:flex;flex-direction:column;height:100%">
          <div id="main-header">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:16px">
              <h2 style="margin:0">Account Reconciliation</h2>
              <button class="btn btn-ghost" style="flex-shrink:0" :disabled="reconRunning" @click="runReconciliation()">
                <span x-text="reconRunning ? 'Running…' : 'Run Now'"></span>
              </button>
            </div>
            <div class="balance-row" style="margin-top:4px">
              <template x-if="reconMatches.length > 0">
                <span>
                  <span class="recon-stat"><strong x-text="reconMatchedCount"></strong> matched</span>
                  <span class="recon-stat"><strong x-text="reconSfinOnlyCount"></strong> SimpleFIN-only</span>
                  <span class="recon-stat"><strong x-text="reconLfOnlyCount"></strong> LunchFlow-only</span>
                </span>
              </template>
              <template x-if="reconMatches.length === 0 && !reconLoading">
                <span>No reconciliation data yet — waiting for first fetch.</span>
              </template>
            </div>
            <div class="tab-bar">
              <button @click="reconTab = 'matches'" :class="{ active: reconTab === 'matches' }">Account Matches</button>
              <button @click="reconTab = 'rules'" :class="{ active: reconTab === 'rules' }">Rules</button>
            </div>
          </div>

          <div id="content">
            <template x-if="reconLoading">
              <div class="placeholder">Loading…</div>
            </template>
            <template x-if="reconError">
              <div class="error-msg" x-text="reconError"></div>
            </template>

            <!-- Account Matches tab -->
            <template x-if="!reconLoading && !reconError && reconTab === 'matches'">
              <div>
                <template x-if="reconMatches.length === 0">
                  <div class="placeholder">No account matches yet.</div>
                </template>
                <template x-if="reconMatches.length > 0">
                  <table>
                    <thead>
                      <tr>
                        <th>Status</th>
                        <th>SimpleFIN Account</th>
                        <th>LunchFlow Account</th>
                        <th>Confidence</th>
                        <th>Display Name</th>
                        <th>Actions</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="row in reconMatches" :key="row.id">
                        <tr>
                          <td>
                            <template x-if="row.status === 'matched'">
                              <span>
                                <span class="status-badge matched">Matched</span>
                                <template x-if="isUserForced(row)">
                                  <span class="status-badge user" style="margin-left:4px">User</span>
                                </template>
                              </span>
                            </template>
                            <template x-if="row.status === 'sfin_only'">
                              <span class="status-badge sfin-only">SimpleFIN only</span>
                            </template>
                            <template x-if="row.status === 'lf_only'">
                              <span class="status-badge lf-only">LunchFlow only</span>
                            </template>
                          </td>
                          <td x-text="row.sfin_name ?? '—'"></td>
                          <td x-text="row.lf_name ?? '—'"></td>
                          <td class="confidence">
                            <template x-if="row.match_confidence > 0">
                              <span x-text="Math.round(row.match_confidence * 100) + '%'"></span>
                            </template>
                            <template x-if="!row.match_confidence || row.match_confidence === 0">
                              <span>—</span>
                            </template>
                          </td>
                          <td>
                            <template x-if="row.status === 'matched'">
                              <select
                                style="border:1px solid var(--border);border-radius:var(--radius);padding:3px 6px;font-size:12px;font-family:var(--font);background:var(--surface);color:var(--text)"
                                :value="row.preferred_name_source"
                                @change="setNamePreference(row, $event.target.value)"
                              >
                                <option value="simplefin" x-text="row.sfin_name ?? 'SimpleFIN'"></option>
                                <option value="lunchflow" x-text="row.lf_name ?? 'LunchFlow'"></option>
                              </select>
                            </template>
                            <template x-if="row.status !== 'matched'">
                              <span>—</span>
                            </template>
                          </td>
                          <td>
                            <template x-if="row.status === 'matched'">
                              <button class="btn-sm danger" @click="unlinkAccounts(row)">Unlink</button>
                            </template>
                            <template x-if="row.status === 'sfin_only'">
                              <div>
                                <template x-if="linkingMatchId !== row.id">
                                  <button class="btn-sm ghost" @click="startLinking(row)">Link to LunchFlow ▾</button>
                                </template>
                                <template x-if="linkingMatchId === row.id">
                                  <div class="inline-link-form">
                                    <select x-model="linkingTarget">
                                      <option value="">Select account…</option>
                                      <template x-for="a in availableLfAccounts" :key="a.lf_account_id">
                                        <option :value="a.lf_account_id" x-text="a.lf_name"></option>
                                      </template>
                                    </select>
                                    <button class="btn-sm" :disabled="!linkingTarget" @click="confirmLink(row)">Link</button>
                                    <button class="btn-sm ghost" @click="cancelLinking()">Cancel</button>
                                  </div>
                                </template>
                              </div>
                            </template>
                            <template x-if="row.status === 'lf_only'">
                              <div>
                                <template x-if="linkingMatchId !== row.id">
                                  <button class="btn-sm ghost" @click="startLinking(row)">Link to SimpleFIN ▾</button>
                                </template>
                                <template x-if="linkingMatchId === row.id">
                                  <div class="inline-link-form">
                                    <select x-model="linkingTarget">
                                      <option value="">Select account…</option>
                                      <template x-for="a in availableSfinAccounts" :key="a.sfin_account_id">
                                        <option :value="a.sfin_account_id" x-text="a.sfin_name"></option>
                                      </template>
                                    </select>
                                    <button class="btn-sm" :disabled="!linkingTarget" @click="confirmLink(row)">Link</button>
                                    <button class="btn-sm ghost" @click="cancelLinking()">Cancel</button>
                                  </div>
                                </template>
                              </div>
                            </template>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </template>
              </div>
            </template>

            <!-- Rules tab -->
            <template x-if="!reconLoading && !reconError && reconTab === 'rules'">
              <div>
                <!-- Add rule form -->
                <template x-if="!showAddRule">
                  <div style="margin-bottom:16px">
                    <button class="btn" @click="showAddRule = true">+ Add Rule</button>
                  </div>
                </template>
                <template x-if="showAddRule">
                  <div class="recon-form">
                    <label>
                      Action
                      <select x-model="newRuleAction">
                        <option value="match">Force match</option>
                        <option value="exclude">Exclude</option>
                      </select>
                    </label>
                    <label>
                      SimpleFIN Account
                      <select x-model="newRuleSfinId">
                        <option value="">— (any)</option>
                        <template x-for="a in allSfinAccounts" :key="a.sfin_account_id">
                          <option :value="a.sfin_account_id" x-text="a.sfin_name"></option>
                        </template>
                      </select>
                    </label>
                    <label>
                      LunchFlow Account
                      <select x-model="newRuleLfId">
                        <option value="">— (any)</option>
                        <template x-for="a in allLfMatchAccounts" :key="a.lf_account_id">
                          <option :value="a.lf_account_id" x-text="a.lf_name"></option>
                        </template>
                      </select>
                    </label>
                    <div style="display:flex;gap:8px;align-items:center">
                      <button class="btn" :disabled="newRuleSubmitting || !isNewRuleValid" @click="submitAddRule()">Save</button>
                      <button class="btn btn-ghost" @click="cancelAddRule()">Cancel</button>
                      <span class="error-msg" x-show="newRuleError" x-text="newRuleError" style="padding:0"></span>
                    </div>
                  </div>
                </template>

                <template x-if="reconRules.length === 0">
                  <div class="placeholder">No user-defined rules. Rules override automatic reconciliation.</div>
                </template>
                <template x-if="reconRules.length > 0">
                  <table>
                    <thead>
                      <tr>
                        <th>Action</th>
                        <th>SimpleFIN Account</th>
                        <th>LunchFlow Account</th>
                        <th></th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="rule in reconRules" :key="rule.id">
                        <tr>
                          <td>
                            <span class="status-badge" :class="rule.action === 'match' ? 'matched' : 'sfin-only'" x-text="rule.action === 'match' ? 'Force match' : 'Exclude'"></span>
                          </td>
                          <td x-text="sfinNameForId(rule.sfin_account_id) ?? '— (any)'"></td>
                          <td x-text="lfNameForId(rule.lf_account_id) ?? '— (any)'"></td>
                          <td style="text-align:right">
                            <button class="btn-sm danger" @click="deleteRule(rule.id)">Delete</button>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </template>
              </div>
            </template>
          </div>
        </div>
      </template>

    </div>
  </div>

  <script>
    const PAGE_SIZE = 30;
    const OVERVIEW_DAYS = 90;

    function app() {
      return {
        // Nav
        view: 'overview',

        // Accounts
        accounts: [],
        accountsError: null,
        selected: null,

        // Account detail
        tab: 'transactions',
        transactions: [],
        txLoading: false,
        txError: null,
        holdings: [],
        holdingsLoading: false,
        holdingsError: null,
        startDate: '',
        endDate: '',

        // Expanded reconciled transaction rows (keyed by transactionId)
        expandedTxns: {},

        // Overview
        overviewPending: [],
        overviewPosted: [],
        displayItems: [],   // pending first, then posted — recomputed on load/filter change
        overviewPage: 0,
        overviewFilter: 'all',
        overviewLoading: false,
        overviewError: null,

        // Status
        status: 'Loading…',
        statusError: false,

        // Reconciliation management
        reconTab: 'matches',
        reconMatches: [],
        reconRules: [],
        reconLoading: false,
        reconRunning: false,
        reconError: null,
        // Inline link picker
        linkingMatchId: null,
        linkingRow: null,
        linkingTarget: '',
        // Add rule form
        showAddRule: false,
        newRuleAction: 'match',
        newRuleSfinId: '',
        newRuleLfId: '',
        newRuleSubmitting: false,
        newRuleError: null,

        get lunchflowPresent() {
          return this.accounts.some(a => a.accountId.startsWith('LUNCHFLOW-') || a.accountId.startsWith('REC-'));
        },

        get reconAccounts() {
          return this.accounts.filter(a => a.accountId.startsWith('REC-'));
        },

        get sfinAccounts() {
          const reconciled = new Set(this.reconAccounts.map(a => a.simplefinAccountId).filter(Boolean));
          return this.accounts.filter(a => a.accountId.startsWith('SIMPLEFIN-') && !reconciled.has(a.accountId));
        },

        get lfAccounts() {
          const reconciled = new Set(this.reconAccounts.map(a => a.lunchflowAccountId).filter(Boolean));
          return this.accounts.filter(a => a.accountId.startsWith('LUNCHFLOW-') && !reconciled.has(a.accountId));
        },

        applyOverviewFilter() {
          const rec = this.overviewFilter === 'reconciled';
          const pending = rec
            ? this.overviewPending.filter(tx => tx._accountId.startsWith('REC-'))
            : this.overviewPending;
          const posted = rec
            ? this.overviewPosted.filter(tx => tx._accountId.startsWith('REC-'))
            : this.overviewPosted;
          this.displayItems = [...pending, ...posted];
        },

        setOverviewFilter(f) {
          this.overviewFilter = f;
          this.overviewPage = 0;
          this.applyOverviewFilter();
        },

        // Reconciliation computed helpers
        get reconMatchedCount() {
          return this.reconMatches.filter(r => r.status === 'matched').length;
        },
        get reconSfinOnlyCount() {
          return this.reconMatches.filter(r => r.status === 'sfin_only').length;
        },
        get reconLfOnlyCount() {
          return this.reconMatches.filter(r => r.status === 'lf_only').length;
        },
        isUserForced(row) {
          return this.reconRules.some(r =>
            r.action === 'match' &&
            r.sfin_account_id === row.sfin_account_id &&
            r.lf_account_id === row.lf_account_id
          );
        },
        // All sfin accounts from matches (for dropdowns)
        get allSfinAccounts() {
          return this.reconMatches
            .filter(r => r.sfin_account_id)
            .map(r => ({ sfin_account_id: r.sfin_account_id, sfin_name: r.sfin_name }))
            .filter((v, i, arr) => arr.findIndex(x => x.sfin_account_id === v.sfin_account_id) === i);
        },
        // All lf accounts from matches (for dropdowns)
        get allLfMatchAccounts() {
          return this.reconMatches
            .filter(r => r.lf_account_id)
            .map(r => ({ lf_account_id: r.lf_account_id, lf_name: r.lf_name }))
            .filter((v, i, arr) => arr.findIndex(x => x.lf_account_id === v.lf_account_id) === i);
        },
        // Unmatched lf accounts available for linking
        get availableLfAccounts() {
          const matchedLfIds = new Set(
            this.reconMatches.filter(r => r.status === 'matched').map(r => r.lf_account_id)
          );
          return this.allLfMatchAccounts.filter(a => !matchedLfIds.has(a.lf_account_id));
        },
        // Unmatched sfin accounts available for linking
        get availableSfinAccounts() {
          const matchedSfinIds = new Set(
            this.reconMatches.filter(r => r.status === 'matched').map(r => r.sfin_account_id)
          );
          return this.allSfinAccounts.filter(a => !matchedSfinIds.has(a.sfin_account_id));
        },
        sfinNameForId(id) {
          if (!id) return null;
          const found = this.reconMatches.find(r => r.sfin_account_id === id);
          return found?.sfin_name ?? id;
        },
        lfNameForId(id) {
          if (id == null) return null;
          const found = this.reconMatches.find(r => r.lf_account_id === id);
          return found?.lf_name ?? String(id);
        },
        get isNewRuleValid() {
          if (!this.newRuleSfinId && !this.newRuleLfId) return false;
          if (this.newRuleAction === 'match' && (!this.newRuleSfinId || !this.newRuleLfId)) return false;
          return true;
        },

        get overviewPagedItems() {
          const start = this.overviewPage * PAGE_SIZE;
          return this.displayItems.slice(start, start + PAGE_SIZE);
        },

        get overviewTotalPages() {
          return Math.max(1, Math.ceil(this.displayItems.length / PAGE_SIZE));
        },

        get overviewSubtitle() {
          const p = this.overviewPending.length;
          const n = this.overviewPosted.length;
          const parts = [];
          if (p > 0) parts.push(`${p} pending`);
          parts.push(`${n} posted (last ${OVERVIEW_DAYS} days)`);
          return parts.join(' · ');
        },

        init() {
          const end = new Date();
          const start = new Date();
          start.setDate(start.getDate() - 30);
          this.endDate = end.toISOString().slice(0, 10);
          this.startDate = start.toISOString().slice(0, 10);
          this.refreshStatus();
          this.loadAccounts();
          setInterval(() => this.refreshStatus(), 60_000);
        },

        async refreshStatus() {
          try {
            const h = await fetch('/health').then(r => r.json());
            if (h.fetchError) {
              this.status = 'Fetch error: ' + h.fetchError;
              this.statusError = true;
            } else if (h.lastFetched) {
              const ago = Math.round((Date.now() / 1000 - new Date(h.lastFetched).getTime() / 1000) / 60);
              this.status = ago < 2 ? 'Updated just now' : `Updated ${ago}m ago`;
              this.statusError = false;
            } else {
              this.status = 'Waiting for first fetch…';
              this.statusError = false;
            }
          } catch {
            this.status = 'Server unreachable';
            this.statusError = true;
          }
        },

        async loadAccounts() {
          try {
            const d = await fetch('/fdx/v6/accounts').then(r => r.json());
            this.accounts = d.accounts ?? [];
            await this.loadOverview();
          } catch (e) {
            this.accountsError = e.message;
          }
        },

        async selectOverview() {
          this.view = 'overview';
          this.selected = null;
          this.overviewPage = 0;
          if (this.overviewPosted.length === 0 && this.overviewPending.length === 0 && !this.overviewLoading) {
            await this.loadOverview();
          }
        },

        async selectAccount(acct) {
          this.view = 'account';
          this.selected = acct;
          this.tab = 'transactions';
          await this.loadTransactions();
        },

        async loadOverview() {
          if (this.accounts.length === 0) return;
          this.overviewLoading = true;
          this.overviewError = null;
          this.overviewPage = 0;

          const end = new Date();
          const start = new Date();
          start.setDate(start.getDate() - OVERVIEW_DAYS);
          const startIso = start.toISOString().slice(0, 10) + 'T00:00:00Z';
          const endIso = end.toISOString().slice(0, 10) + 'T23:59:59Z';

          try {
            // Build the set of source account IDs claimed by a REC- account so
            // we don't also fetch their transactions from the raw source endpoints.
            const claimedByRec = new Set(
              this.accounts
                .filter(a => a.accountId.startsWith('REC-'))
                .flatMap(a => [a.simplefinAccountId, a.lunchflowAccountId])
                .filter(Boolean)
            );
            const visibleAccounts = this.accounts.filter(a =>
              a.accountId.startsWith('REC-') || !claimedByRec.has(a.accountId)
            );
            const results = await Promise.all(visibleAccounts.map(async acct => {
              const url = `/fdx/v6/accounts/${encodeURIComponent(acct.accountId)}/transactions`
                + `?startTime=${encodeURIComponent(startIso)}&endTime=${encodeURIComponent(endIso)}`;
              const d = await fetch(url).then(r => r.json());
              const currency = acct.currency?.currencyCode ?? 'USD';
              return (d.transactions ?? []).map(tx => ({
                ...tx,
                _accountId: acct.accountId,
                _accountName: acct.displayName,
                _currency: currency,
              }));
            }));

            const all = results.flat();
            this.overviewPending = all.filter(tx => tx.status === 'PENDING');
            this.overviewPosted = all
              .filter(tx => tx.status !== 'PENDING')
              .sort((a, b) => new Date(b.postedTimestamp) - new Date(a.postedTimestamp));
            this.applyOverviewFilter();
          } catch (e) {
            this.overviewError = e.message;
          } finally {
            this.overviewLoading = false;
          }
        },

        async switchTab(tab) {
          this.tab = tab;
          if (tab === 'transactions') await this.loadTransactions();
          else await this.loadHoldings();
        },

        async loadTransactions() {
          if (!this.selected) return;
          this.txLoading = true;
          this.txError = null;
          this.transactions = [];
          try {
            const startIso = this.startDate + 'T00:00:00Z';
            const endIso = this.endDate + 'T23:59:59Z';
            const url = `/fdx/v6/accounts/${encodeURIComponent(this.selected.accountId)}/transactions`
              + `?startTime=${encodeURIComponent(startIso)}&endTime=${encodeURIComponent(endIso)}`;
            const d = await fetch(url).then(r => r.json());
            this.transactions = d.transactions ?? [];
          } catch (e) {
            this.txError = e.message;
          } finally {
            this.txLoading = false;
          }
        },

        async loadHoldings() {
          if (!this.selected) return;
          this.holdingsLoading = true;
          this.holdingsError = null;
          this.holdings = [];
          try {
            const d = await fetch(`/fdx/v6/accounts/${encodeURIComponent(this.selected.accountId)}/holdings`).then(r => r.json());
            this.holdings = d.holdings ?? [];
          } catch (e) {
            this.holdingsError = e.message;
          } finally {
            this.holdingsLoading = false;
          }
        },

        async setNamePreference(row, preferredSource) {
          row.preferred_name_source = preferredSource;
          await fetch(`/api/reconciliation/name-preference/${encodeURIComponent(row.sfin_account_id)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ preferred_source: preferredSource }),
          });
          // Reload accounts so the sidebar and header reflect the new name.
          await this.loadAccounts();
        },

        async runReconciliation() {
          this.reconRunning = true;
          try {
            await fetch('/api/reconciliation/run', { method: 'POST' });
            await this.loadReconciliationData();
            await this.loadAccounts();
          } finally {
            this.reconRunning = false;
          }
        },

        async selectReconciliation() {
          this.view = 'reconciliation';
          this.selected = null;
          await this.loadReconciliationData();
        },

        async loadReconciliationData() {
          this.reconLoading = true;
          this.reconError = null;
          try {
            const [matches, rules] = await Promise.all([
              fetch('/api/reconciliation/account-matches').then(r => r.json()),
              fetch('/api/reconciliation/account-rules').then(r => r.json()),
            ]);
            this.reconMatches = matches;
            this.reconRules = rules;
          } catch (e) {
            this.reconError = e.message;
          } finally {
            this.reconLoading = false;
          }
        },

        startLinking(row) {
          this.linkingMatchId = row.id;
          this.linkingRow = row;
          this.linkingTarget = '';
        },

        cancelLinking() {
          this.linkingMatchId = null;
          this.linkingRow = null;
          this.linkingTarget = '';
        },

        async confirmLink(row) {
          if (!this.linkingTarget) return;
          const sfinId = row.status === 'sfin_only' ? row.sfin_account_id : this.linkingTarget;
          const lfId = row.status === 'lf_only' ? row.lf_account_id : parseInt(this.linkingTarget, 10);
          await this.addRule('match', sfinId, lfId);
          this.cancelLinking();
        },

        async addRule(action, sfinId, lfId) {
          const body = { action };
          if (sfinId) body.sfin_account_id = sfinId;
          if (lfId != null) body.lf_account_id = lfId;
          const res = await fetch('/api/reconciliation/account-rules', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({ error: 'Request failed' }));
            throw new Error(err.error ?? 'Request failed');
          }
          await this.loadReconciliationData();
          // Reload accounts so the sidebar reflects the new match.
          await this.loadAccounts();
        },

        async unlinkAccounts(row) {
          // If there's a user-forced match rule, delete it.
          const rule = this.reconRules.find(r =>
            r.action === 'match' &&
            r.sfin_account_id === row.sfin_account_id &&
            r.lf_account_id === row.lf_account_id
          );
          if (rule) {
            await this.deleteRule(rule.id);
            return;
          }
          // Otherwise create an exclude rule to block the auto-match.
          await this.addRule('exclude', row.sfin_account_id, row.lf_account_id);
        },

        async submitAddRule() {
          this.newRuleSubmitting = true;
          this.newRuleError = null;
          try {
            await this.addRule(
              this.newRuleAction,
              this.newRuleSfinId || null,
              this.newRuleLfId ? parseInt(this.newRuleLfId, 10) : null,
            );
            this.cancelAddRule();
          } catch (e) {
            this.newRuleError = e.message;
          } finally {
            this.newRuleSubmitting = false;
          }
        },

        cancelAddRule() {
          this.showAddRule = false;
          this.newRuleAction = 'match';
          this.newRuleSfinId = '';
          this.newRuleLfId = '';
          this.newRuleError = null;
        },

        async deleteRule(id) {
          await fetch(`/api/reconciliation/account-rules/${id}`, { method: 'DELETE' });
          await this.loadReconciliationData();
          await this.loadAccounts();
        },

        toggleExpand(id) {
          this.expandedTxns = this.expandedTxns[id]
            ? Object.fromEntries(Object.entries(this.expandedTxns).filter(([k]) => k !== id))
            : { ...this.expandedTxns, [id]: true };
        },

        fmt(amount, currency) {
          return new Intl.NumberFormat('en-US', {
            style: 'currency',
            currency: currency ?? 'USD',
          }).format(amount);
        },

        fmtDate(iso) {
          if (!iso) return '—';
          return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        },

        fmtDateShort(iso) {
          if (!iso) return '—';
          return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        },
      };
    }
  </script>
</body>
